name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - kilo/**
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release and Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate deterministic release keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/app/release.jks"
          KEY_PROPERTIES_PATH="android/key.properties"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias apex-release \
              -storepass apexagent-release \
              -keypass apexagent-release \
              -dname "CN=Apex Agent, OU=Apex, O=Apex, L=Lagos, ST=Lagos, C=NG"
          fi
          printf '%s\n' \
            'storePassword=apexagent-release' \
            'keyPassword=apexagent-release' \
            'keyAlias=apex-release' \
            'storeFile=release.jks' > "$KEY_PROPERTIES_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
